[project]
name = "fb"
version = "0.1.0"
description = "Lite Forward-Backward (F / B / π) for dm_control Walker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dm-control",
    "numpy",
    "torch",
    "tqdm",
    "wandb",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fb*"]
